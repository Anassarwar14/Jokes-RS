version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jokes-postgres
    environment:
      POSTGRES_USER: jokes_user
      POSTGRES_PASSWORD: jokes_password
      POSTGRES_DB: jokes_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jokes_user -d jokes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
